name: SmartSpend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db
      JWT_SECRET_KEY: ci-only-secret
      JWT_ALGORITHM: HS256
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USERNAME: test@example.com
      SMTP_PASSWORD: test-password
      SMTP_FROM_EMAIL: ci@example.com
      SMTP_FROM_NAME: SmartSpend CI
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check application import
        run: |
          python -c "from app.main import app; print('SmartSpend API import successful')"